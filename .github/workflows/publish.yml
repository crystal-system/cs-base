name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npx nx run-many -t build
      - run: chmod +x dist/packages/skills/bin.cjs.js
      - run: npm publish dist/packages/nx-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish dist/packages/skills
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
